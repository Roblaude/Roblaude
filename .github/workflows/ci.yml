name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.labels.*.name, ','), '') ||
      true
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - run: npm ci
      - run: npx eslint .
      - run: npm run build
      # --passWithNoTests : ne casse pas tant que les tests ne sont pas sur dev
      - run: npm test -- --passWithNoTests

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/roblaude
      JWT_SECRET: ci-test-secret-pas-pour-la-prod

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: roblaude
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/backend/package-lock.json

      - run: npm ci
      - run: npm run build
      # applique les migrations comme en prod (Render) — detecte un drift schema/migrations
      - run: npx prisma migrate deploy
      - run: npm test -- --passWithNoTests

